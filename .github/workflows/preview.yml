name: Branch preview

# On-demand branch image for local/dev testing. The Build workflow no longer
# pushes images for branches/PRs (they build + smoke-test only); run this from
# the Actions tab when you actually want a pullable image for a branch. Pushes
# only to GHCR under a branch-prefixed tag so Docker Hub stays clean.

on:
  workflow_dispatch:
    inputs:
      bun-version:
        description: 'Bun version (e.g. 1.3.14)'
        required: true
      alpine-version:
        description: 'Alpine version/branch (e.g. latest, 3.22, edge)'
        required: true
        default: latest
      platforms:
        description: 'Target platforms'
        required: true
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve tag
        id: vars
        run: |
          # Lower-case the image ref and sanitise the branch name for a Docker tag.
          TAG=$(echo "ghcr.io/${{ github.repository }}:$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ inputs.bun-version }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.vars.outputs.tag }}
          build-args: |
            ALPINE_VERSION=${{ inputs.alpine-version }}
            BUN_VERSION=${{ inputs.bun-version }}

      - name: Summary
        run: echo "Pushed preview image \`${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
